name: Test check-credentials-only mode
on:
  workflow_dispatch:

jobs:
  test-check-credentials-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in check-credentials-only mode with fake credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          client-id: fake-client-id
          client-secret: fake-client-secret
          refresh-token: fake-refresh-token
          check-credentials-only: "true"

      - name: Assert action failed due to invalid credentials (not missing inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid (not because inputs are missing)
          # A 'failure' outcome means the action ran and encountered an auth error, which is expected
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
