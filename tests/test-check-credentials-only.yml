name: Test check-credentials-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test check-credentials-only with invalid credentials
        id: action
        uses: .
        with:
          client-id: fake-client-id
          client-secret: fake-client-secret
          refresh-token: fake-refresh-token
          check-credentials-only: "true"
        continue-on-error: true
      - name: Assert action ran and failed with auth error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid (not because of missing config)
          # A failure here means the action reached the credential-check logic
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
