name: Test check-credentials-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With invalid credentials and check-credentials-only=true, the action
      # should attempt to validate credentials and fail (not publish anything).
      - id: action
        uses: .
        continue-on-error: true
        with:
          client-id: fake-client-id
          client-secret: fake-client-secret
          refresh-token: fake-refresh-token
          check-credentials-only: "true"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
