name: Test default publish action with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal extension zip
        run: |
          mkdir -p /tmp/ext
          cat > /tmp/ext/manifest.json <<'EOF'
          {"manifest_version": 3, "name": "Test", "version": "1.0.0"}
          EOF
          cd /tmp/ext && (zip -q "$GITHUB_WORKSPACE/test-extension.zip" manifest.json || python3 -c "import zipfile; z=zipfile.ZipFile('$GITHUB_WORKSPACE/test-extension.zip','w'); z.write('manifest.json'); z.close()")
          ls -l "$GITHUB_WORKSPACE/test-extension.zip"
      - id: action
        uses: .
        continue-on-error: true
        with:
          publisher-id: invalid-publisher
          extension-id: abcdefghijklmnopabcdefghijklmnop
          zip-path: test-extension.zip
          client-id: invalid-client-id.apps.googleusercontent.com
          client-secret: invalid-client-secret
          refresh-token: invalid-refresh-token
      - name: Assert default publish failed on invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid OAuth credentials"
            exit 1
          fi
          echo "PASS"
