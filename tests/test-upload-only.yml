name: Test upload-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal dummy zip file to pass as the extension zip
      - name: Create dummy zip file
        run: |
          echo "dummy content" > dummy.txt
          zip dummy-extension.zip dummy.txt

      # With upload-only=true and invalid credentials, the action should fail
      # at the authentication step (not at input validation).
      - id: action
        uses: .
        continue-on-error: true
        with:
          extension-id: fake-extension-id
          zip-path: dummy-extension.zip
          client-id: fake-client-id
          client-secret: fake-client-secret
          refresh-token: fake-refresh-token
          upload-only: "true"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials in upload-only mode"
