name: Test upload-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal zip file for testing
        run: |
          mkdir -p /tmp/ext-test
          echo '{"manifest_version":3,"name":"Test","version":"1.0"}' > /tmp/ext-test/manifest.json
          cd /tmp/ext-test && zip -r /tmp/test-extension.zip .
          echo "Created test zip at /tmp/test-extension.zip"
          ls -la /tmp/test-extension.zip
      - name: Test upload-only with invalid credentials
        id: action
        uses: .
        with:
          extension-id: fake-extension-id
          zip-path: /tmp/test-extension.zip
          client-id: fake-client-id
          client-secret: fake-client-secret
          refresh-token: fake-refresh-token
          upload-only: "true"
        continue-on-error: true
      - name: Assert action ran and failed with auth error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid (not because of missing config)
          # A failure here means the action reached the upload logic
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
