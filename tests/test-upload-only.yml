name: Test upload-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake extension zip file
        run: |
          mkdir -p /tmp/ext
          echo '{"manifest_version":3,"name":"Test","version":"1.0"}' > /tmp/ext/manifest.json
          cd /tmp/ext && zip /tmp/extension.zip manifest.json

      - name: Run action in upload-only mode with fake credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          extension-id: fake-extension-id
          zip-path: /tmp/extension.zip
          client-id: fake-client-id
          client-secret: fake-client-secret
          refresh-token: fake-refresh-token
          upload-only: "true"

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
