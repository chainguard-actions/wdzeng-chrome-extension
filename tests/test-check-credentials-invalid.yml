name: Test check-credentials with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: check-credentials
          client-id: invalid-client-id.apps.googleusercontent.com
          client-secret: invalid-client-secret
          refresh-token: invalid-refresh-token
      - name: Assert action failed on invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid OAuth credentials"
            exit 1
          fi
          echo "PASS"
